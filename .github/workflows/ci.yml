name: CI

on:
  push:
    branches: [master, modernize]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show environment
        run: python -c "import numpy, h5py, fabio, sys; print(sys.version); print('numpy', numpy.__version__); print('h5py', h5py.__version__); print('fabio', fabio.version)"

      - name: Test
        run: pytest -q

  # The viewer is an extra, so the matrix above installs neither PyQt5 nor
  # PyOpenGL and tests/test_viewer_widgets.py skips there. This job is the one
  # place the widgets are exercised. QT_QPA_PLATFORM=offscreen gives Qt a
  # windowing system it can run headless; it provides no GL context, so the
  # shaders are not compiled here -- what CI checks is the widget wiring.
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the system libraries the PyQt5 wheel links against
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viewer]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests/test_viewer.py tests/test_viewer_widgets.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
